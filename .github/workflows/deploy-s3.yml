
name: OIDC to AWS 

on:
  push:
    branches: [main]

jobs:
  runs-on: ubuntu-latest
  - uses: actions/checkout@v4

  - name: Assume AWS role via OIDC
    uses: aws-actions/aws-configure-credentials@v4
    with:
      role-to-assume: arn:aws:iam::211125431540:role/GitHubActions-S3-Deploy
      aws-region: us-east-1
  
  - name: Sync to S3
    run: aws s3 sync ./public s3://my-bucket --delete